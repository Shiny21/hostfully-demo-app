services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hostfully
      POSTGRES_PASSWORD: hostfully_password
      POSTGRES_DB: hostfully_bookings
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostfully -d hostfully_bookings"]
      interval: 5s
      timeout: 3s
      start_period: 90s
      retries: 12

  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql+psycopg2://hostfully:hostfully_password@db:5432/hostfully_bookings
    depends_on:
      db:
        condition: service_healthy
